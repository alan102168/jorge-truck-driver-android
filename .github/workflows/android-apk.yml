name: Android Normal - Gerar APK
on:
  push:
    branches: [android-normal]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jorge-Android-Normal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-normal-v1.0.${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk#Jorge-Android-Normal.apk \
            --title "Jorge Truck Driver - Android Normal v1.0.${{ github.run_number }}" \
            --notes "Versao de teste Android. APK de debug para instalacao e testes." \
            --target "$GITHUB_SHA"
