name: Android Pixel Art - Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Identificar arquivo do APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Jorge-Android-Pixel.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jorge-Android-Pixel-APK
          path: dist/Jorge-Android-Pixel.apk
          if-no-files-found: error

      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pixel-v2.0.${{ github.run_number }}" \
            dist/Jorge-Android-Pixel.apk \
            --title "Jorge Pixel Edition Android v2.0.${{ github.run_number }}" \
            --notes "Pixel Edition 16 bits com controles e layout TV/celular. APK de teste. Instala ao lado do jogo Android anterior." \
            --target "$GITHUB_SHA"
